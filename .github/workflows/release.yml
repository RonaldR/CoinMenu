# Push a version tag (`npm version patch && git push --follow-tags`) to build the installers for
# macOS, Windows and Linux and publish them as a GitHub release. Start it by hand from the Actions
# tab to build the installers without releasing them; they are attached to the run instead.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # electron-builder downloads its own Electron, so npm ci can skip the development binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag matches the package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version). Use npm version to create tags."
            exit 1
          fi
      - run: npm run check

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ runner.os }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          merge-multiple: true
          path: installers
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CoinMenu $GITHUB_REF_NAME" \
            --notes-file - \
            --generate-notes <<'NOTES'
          ## Download

          - **Mac with Apple Silicon** (M1 and newer): `CoinMenu-*-mac-arm64.dmg`
          - **Mac with Intel**: `CoinMenu-*-mac-x64.dmg`
          - **Windows**: `CoinMenu-*-setup.exe`
          - **Linux**: `CoinMenu-*.AppImage`

          Not sure which Mac you have? Apple menu → About This Mac → Chip.

          The installers are not signed with a developer certificate. On a Mac, open CoinMenu the first time
          from System Settings → Privacy & Security → Open Anyway. On Windows, choose More info → Run anyway.
          NOTES
